name = "ai-chat-app"
main = "src/index.ts"
compatibility_date = "2024-04-05"

[vars]
# Environment variables would be set in Cloudflare dashboard
# TELEGRAM_TOKEN = ""
# GOOGLE_AI_API_KEY = ""
# OPENROUTER_API_KEY = ""

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "RATE_LIMIT_KV_ID_PLACEHOLDER"

[ai]
binding = "AI"

[site]
bucket = "./public"
