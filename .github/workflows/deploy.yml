name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Deploy with Wrangler
        run: npm run deploy
        env:
          # Set this secret in your GitHub repository settings -> Secrets -> Actions
          # Token should have permissions to edit Workers and related resources
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test deployed worker
        env:
          # Optional: set DEPLOY_URL in repository secrets (e.g., https://ai.example.workers.dev)
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          URL=${DEPLOY_URL:-https://ai.dessyatykh.workers.dev}
          echo "Running smoke test against $URL"
          status=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
          echo "HTTP status: $status"
          if [ "$status" -ne 200 ]; then
            echo "Smoke test failed with status $status" >&2
            exit 1
          fi
