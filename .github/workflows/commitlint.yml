name: Commitlint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ '**' ]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commitlint
        uses: wagoid/commitlint-action@v6
        with:
          configFile: .commitlintrc.json