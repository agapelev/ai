<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shekinah Mission AI Chat</title>
    
    <!-- Favicon с темой Shekinah -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="favicon-16x16.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    
    <!-- Always use dark theme -->
    <script>
      document.documentElement.setAttribute('data-theme', 'dark');
    </script>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <!-- Орбитальная иконка Оракула (Цитадель Духа) -->
      <div class="orbit-container" aria-hidden="true">
        <div class="orbit-glow"></div>
        <div class="orbit-line-1"></div>
        <div class="orbit-line-2"></div>
        <div class="orbit-center">🤖</div>
      </div>
      <h1><span class="word-1">Shekinah</span> <span class="word-2">Mission</span> <span class="word-3">AI Chat</span></h1>
      <p>Powered by Web Arystan using Cloudflare Workers AI</p>
      <div style="margin-top: 10px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px;">
        <label for="model-select" class="model-label">Модель:</label>
        <select id="model-select" aria-label="Выбор модели"></select>
        <span id="model-status" class="model-status" title="Статус модели" aria-hidden="true">●</span>

        <button id="clear-history" class="clear-history-btn" aria-label="Очистить историю" title="Очистить историю чата">🗑️</button>
        <button id="clear-models-cache" class="clear-cache-btn" aria-label="Очистить кэш моделей" title="Очистить кэш моделей и обновить список">🔄</button>
        <div class="models-dropdown-container">
          <a href="templates/inspiration" target="_blank" rel="noopener" class="models-link">О моделях ▼</a>
          <div class="models-dropdown" id="models-dropdown">
            <a href="templates/inspiration" target="_blank" rel="noopener" class="dropdown-item">📄 HTML версия</a>
            <a href="templates/inspiration.md" target="_blank" rel="noopener" class="dropdown-item">📝 Markdown версия</a>
          </div>
        </div>
      </div>
    </header>

    <div class="chat-container">
      <div id="chat-messages" class="chat-messages"></div>

      <!-- Scroll Buttons inside chat container -->
      <button class="scroll-to-top" id="scrollToTop" title="Прокрутить вверх">↑</button>
      <button class="scroll-to-bottom" id="scrollToBottom" title="Прокрутить вниз">↓</button>

      <div class="typing-indicator" id="typing-indicator">
        ИИ думает...
      </div>

      <!-- Progress Bar -->
      <div class="progress-container" id="progress-container" style="display: none;">
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">
          <span id="progress-time">0</span>с
          <span id="progress-status">Обработка запроса...</span>
        </div>
      </div>

      <!-- Message Input Panel -->
      <div class="message-input-panel">
        <div class="input-row">
          <textarea
            id="user-input"
            placeholder="Введите сообщение..."
            rows="1"
            autofocus
          ></textarea>
          <div class="input-actions">
            <div class="file-buttons">
              <button class="file-btn" id="file-upload-btn" title="Загрузить файл">
                📎 Файл
              </button>
              <input type="file" id="file-input" class="file-input-hidden" multiple accept=".js,.ts,.md,.mdx,.org,.txt,.json,.jpg,.jpeg,.png,.gif,.webp,.pdf">

              <button class="file-btn" id="image-upload-btn" title="Загрузить изображение">
                🖼️ Изображение
              </button>
              <input type="file" id="image-input" class="file-input-hidden" accept="image/*">
            </div>
            <button id="send-button">Отправить</button>
          </div>
        </div>

        <div class="uploaded-files-container" id="uploaded-files-container"></div>
      </div>
    </div>

    <footer>
      <p>Web Development Studio Arystan AI Chat &copy; 2025</p>
    </footer>

    <!-- Mobile Input Panel Toggle -->
    <button class="input-panel-toggle" id="input-panel-toggle" title="Открыть/закрыть панель ввода">⌨️</button>

    <!-- Markdown renderer + sanitizer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js" defer></script>
    <script type="module" src="chat.js" defer></script>
  </body>
</html>
